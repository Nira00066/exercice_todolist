<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css"
    />
  </head>
  <body>
    <section class="container_todo container py-5">
      <div class="container_titre d-flex">
        <div class="logo"><img src="img/logo.svg" alt="" /></div>
        <div class="titre">
          <h1>To Do !</h1>
        </div>
      </div>
      <form action="" class="d-flex gap-2 pb-4">
        <label for="" class="visually-hidden"></label>
        <input type="text" class="form-control" />
        <button type="button" class="btn btn-primary">
          <i class="bi-plus-circle me-1"></i>Ajouter
        </button>
      </form>

      <ul class="list-group">
        <li
          class="todo list-group-item d-flex align-items-center justify-content-between"
        >
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="todo-1" />
            <label class="form-check-label ms-2" for="todo-1">
             
            </label>
          </div>
          <button class="btn btn-danger btn-sm" aria-label="Supprimer">
            <i class="bi-trash"></i>
          </button>
        </li>
      </ul>
    </section>

    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
      integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
      integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V"
      crossorigin="anonymous"
    ></script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
